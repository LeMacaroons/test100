---
# ============================================================================
# Hourly Statistics Snapshot - All Clients
# ============================================================================
#
# Purpose: runs on its own independent hourly Azure DevOps schedule
# (separate release from the nightly job-submission one). Loops through
# every client in clients.yml and pulls one full, current-state statistics
# snapshot for each, logging to /logs/gcpg/retention/stats/.
#
# Deliberately does NOT try to compute before/after or deltas itself - it
# just logs regular, evenly-spaced readings. Splunk (timechart/delta) is
# what figures out rate of change, backlog draining speed, growth/shrink
# trends, etc. from the resulting time series. This also means visibility
# isn't tied to when a retention job happens to run - you get the shape of
# progress throughout the whole night, not just one net number the next
# morning.
#
# --------------------------------------------------------------------------
# Wiring into Azure DevOps Classic Release, scheduled hourly:
# --------------------------------------------------------------------------
# This should be its OWN Release pipeline/definition, separate from the
# nightly job-submission one, with its own Scheduled release trigger set to
# run every hour (Edit -> Triggers -> Scheduled release trigger -> hourly).
#
#   ansible-playbook hourly_stats_snapshot.yml \
#     --extra-vars "cluster_name=$(cluster_name) retention_api_user=$(retention_api_user) retention_api_base=$(retention_api_base) projectid=$(projectid) cir_api_secret=$(cir_api_secret) json_file=$(json_file)"
#
# --------------------------------------------------------------------------
# Credential handling - Google Secret Manager:
# --------------------------------------------------------------------------
# The retention API password is NOT passed in directly - it's fetched from
# Google Secret Manager at runtime:
#   1. gcloud auth login --cred-file=/shared/config/admin/{{ json_file }}.json
#   2. gcloud secrets versions access latest --secret={{ cir_api_secret }} --project={{ projectid }}
#
# json_file identifies which credential file under /shared/config/admin/ to
# use (filename minus the .json extension) - confirm this convention and the
# base path match what's actually provisioned on the ADO agent.
#
# Both the auth task and the secret-fetch task use `no_log: true` so the
# credential file handling and the secret VALUE itself never appear in
# Ansible's console/verbose output. Do not remove no_log from either task,
# and do not add any debug task that prints retention_api_password.
#
# NOTE: cluster_name, retention_api_user, retention_api_base, projectid,
# cir_api_secret, and json_file are all required with no defaults, and are
# NOT redeclared as self-assignments in the vars: block (e.g. NOT
# `projectid: "{{ projectid }}"`) - Ansible cannot safely do
# `foo: "{{ foo }}"` when foo isn't already supplied externally; that
# causes a recursive-template error, and would even break this file's own
# validation task. Extra-vars are already directly usable without
# redeclaring them.
#
# --------------------------------------------------------------------------
# Scaling consideration:
# --------------------------------------------------------------------------
# This calls the statistics API once per client, every hour, for every
# client in clients.yml (whether or not they currently have a job running).
# Fine for a handful of clients; if the client list grows large, consider
# either a coarser interval (every 2-4 hours) or restricting this to only
# clients not yet fully caught up.
# ============================================================================

- name: Hourly Statistics Snapshot - All Clients
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - clients.yml

  vars:
    retention_log_dir_stats: "/logs/gcpg/retention/stats"
    run_timestamp: "{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}"
    run_id: "hourly-{{ cluster_name }}-{{ run_timestamp }}"

  tasks:

    - name: Validate GCP config, user, and cluster_name are present
      ansible.builtin.assert:
        that:
          - cluster_name is defined and cluster_name | length > 0
          - retention_api_user is defined and retention_api_user | length > 0
          - retention_api_base is defined and retention_api_base | length > 0
          - projectid is defined and projectid | length > 0
          - cir_api_secret is defined and cir_api_secret | length > 0
          - json_file is defined and json_file | length > 0
        fail_msg: >
          Missing cluster_name, retention_api_user, retention_api_base,
          projectid, cir_api_secret, or json_file (all via --extra-vars).
          None of these have defaults - all must be explicitly supplied.

    - name: Validate a client list was loaded
      ansible.builtin.assert:
        that:
          - clients is defined
          - clients | length > 0
        fail_msg: "clients.yml did not load, or the clients list is empty."

    # ------------------------------------------------------------------
    # Authenticate to Google Cloud, then fetch the retention API password
    # from Secret Manager. no_log is mandatory on both tasks below - do
    # not remove it, and do not add a debug task that prints the result.
    # ------------------------------------------------------------------
    - name: auth gcloud
      ansible.builtin.shell: "gcloud auth login --cred-file=/shared/config/admin/{{ json_file }}.json --force --quiet"
      changed_when: false
      no_log: true

    - name: get password
      ansible.builtin.shell: "gcloud secrets versions access latest --secret={{ cir_api_secret }} --project={{ projectid }}"
      register: cir_api_secret_value
      changed_when: false
      no_log: true

    - name: Set retention_api_password from the retrieved secret
      ansible.builtin.set_fact:
        retention_api_password: "{{ cir_api_secret_value.stdout }}"
      no_log: true

    - name: Validate the password was actually retrieved
      ansible.builtin.assert:
        that:
          - retention_api_password | length > 0
        fail_msg: "Retrieved an empty password from Google Secret Manager - check cir_api_secret and projectid."

    - name: Ensure stats log directory exists
      ansible.builtin.file:
        path: "{{ retention_log_dir_stats }}"
        state: directory
        mode: "0755"

    - name: Initialize the stats log-line accumulator for this run
      ansible.builtin.set_fact:
        retention_stats_log_lines: []

    - name: Pull statistics snapshot for every client
      ansible.builtin.include_tasks: retention_stats_snapshot_one_client.yml
      loop: "{{ clients }}"
      loop_control:
        loop_var: client_item
        label: "{{ client_item.name }}"
      vars:
        stats_snapshot_client_name: "{{ client_item.name }}"
        stats_snapshot_client_id: "{{ client_item.client_id }}"
        stats_snapshot_triggered_by: "hourly-scheduled"
        stats_snapshot_cluster_name: "{{ cluster_name }}"

    - name: Write statistics snapshots to disk for Universal Forwarder pickup
      ansible.builtin.copy:
        dest: "{{ retention_log_dir_stats }}/{{ run_id }}.log"
        content: "{{ retention_stats_log_lines | map('to_json') | join('\n') }}\n"
        mode: "0644"

    - name: Done
      ansible.builtin.debug:
        msg: >
          Hourly statistics snapshot complete for cluster {{ cluster_name }},
          {{ clients | length }} client(s).
          Log: {{ retention_log_dir_stats }}/{{ run_id }}.log
